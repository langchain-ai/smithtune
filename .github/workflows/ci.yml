name: Distribution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Install contributor dependencies
        run: sfw uv sync --locked --extra test --python 3.12
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Verify supported tokenizer integrations
        env:
          SMITHTUNE_TOKENIZER_TESTS: '1'
        run: uv run --no-sync pytest tests/test_tokenizer_integration.py
      - name: Test installed wheels and rebuilt source distributions
        run: python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: distributions
          path: dist/smithtune-*
          if-no-files-found: error
