name: Distribution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Install contributor dependencies
        run: sfw uv sync --locked --extra test --python 3.12
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Verify supported tokenizer integrations
        env:
          SMITHTUNE_TOKENIZER_TESTS: '1'
        run: uv run --no-sync pytest tests/test_tokenizer_integration.py tests/test_baseten_sampling_formats.py
      - name: Test installed wheels and rebuilt source distributions
        run: python scripts/check_dist.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: distributions
          path: |
            dist/smithtune-*
            overrides.txt
          if-no-files-found: error
