[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "smithtune"
version = "0.1.0"
description = "Prepare LangSmith trajectories for Fireworks SFT and Baseten Loops training."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fireworks-training-cookbook @ git+https://github.com/fw-ai/cookbook.git@09bbe1170c804eb5e5d7e7286f0feeef4e26055a#subdirectory=training",
  "fireworks-ai[training]==1.2.11",
  "baseten-loops==0.21.0",
  "jsonschema==4.26.0",
  "tinker==0.23.0",
  "transformers==5.5.4",
  "pillow>=12.3,<13",
  "datasets>=5.0.1,<6",
]

[project.scripts]
smithtune = "smithtune.cli:main"

[project.urls]
Repository = "https://github.com/langchain-ai/smithtune"
Issues = "https://github.com/langchain-ai/smithtune/issues"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smithtune*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
