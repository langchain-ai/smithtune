[build-system]
requires = ["setuptools>=84.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "smithtune"
version = "0.1.8"
description = "LangSmith Fine-Tuning CLI: train and evaluate models on agent trajectories with Fireworks or Baseten."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LangChain", email = "support@langchain.dev" }]
keywords = ["langsmith", "fine-tuning", "sft", "agents", "fireworks", "baseten", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fireworks-training-cookbook==2026.11.5.2",
  "fireworks-ai[training]==1.2.30",
  "baseten-loops==0.21.0",
  "jsonschema==4.26.0",
  "langsmith==0.12.4",
  "referencing==0.37.0",
  "rich==13.9.4",
  "tinker==0.23.0",
  "transformers==5.10.4",
  "trl==1.13.0",
  "pillow>=13.0.0,<14",
  "datasets>=5.0.1,<6",
  "deepagents==0.7.14",
  "langchain-openai==1.6.2",
  "pydantic-monty==0.0.23",
  "langgraph>=1.2.14,<2",
  "langgraph-sdk>=0.4.6,<0.5",
  "opentelemetry-api>=1.45.1,<2",
  "setuptools>=84.1,<85",
]

[project.scripts]
smithtune = "smithtune.cli:main"

[project.urls]
Homepage = "https://github.com/langchain-ai/smithtune"
Repository = "https://github.com/langchain-ai/smithtune"
Issues = "https://github.com/langchain-ai/smithtune/issues"

[project.optional-dependencies]
baseten-deploy = ["truss==0.18.30"]
test = ["pytest==9.1.1", "ruff==0.14.0"]

[tool.setuptools.package-data]
smithtune = ["skills/*/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smithtune*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "sdk_integration: exercise LangSmith integration with an explicitly supplied test client",
    "no_default_rule: run council review without the shared test selection rule",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Lint only; the codebase does not follow `ruff format` and CI does not enforce it.
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # long lines are accepted throughout
  "SIM102", # nested if
  "SIM105", # try/except/pass instead of contextlib.suppress
  "SIM108", # if/else instead of ternary
  "RUF001", # ambiguous unicode in strings (tests use × deliberately)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests pass regular expressions to pytest.raises(match=...) on purpose.
"tests/*" = ["RUF043"]
