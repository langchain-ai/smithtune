[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "smithtune-training-runtime"
version = "0.1.0"
description = "LangChain-maintained distribution of the pinned Fireworks training runtime used by smithtune."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/training/_vendor/tinker_cookbook_0_4_3/LICENSE"]
dependencies = [
  "fireworks-ai[training]==1.2.11",
  "tinker==0.23.0",
  "pillow>=12.3,<13",
  "aiohttp>=3.12,<4",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "requests>=2.32,<3",
  "jinja2>=3.1,<4",
  "omegaconf>=2.3,<3",
  "pyyaml>=6,<7",
  "tqdm>=4.67,<5",
  "torch>=2.8,<3",
  "datasets>=5.0.1,<6",
  "tiktoken>=0.11,<1",
  "numpy>=2,<3",
  "transformers==5.10.4",
  "python-dotenv>=1,<2",
  "wandb>=0.21,<1",
  "orjson>=3.10,<4",
  "hydra-core>=1.3,<2",
]

[project.urls]
Repository = "https://github.com/langchain-ai/smithtune"
Upstream = "https://github.com/fw-ai/cookbook"

[tool.setuptools.packages.find]
where = ["src"]
include = ["training*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.html", "*.md", "LICENSE"]
